services:
  postgres:
    image: postgres:18-alpine
    container_name: proofpath_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-proofpath}
      POSTGRES_USER: ${POSTGRES_USER:-proofpath}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proofpath -d proofpath"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
