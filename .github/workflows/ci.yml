name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with: { dotnet-version: '10.0.x' }
      - run: dotnet restore apps/backend/ProofPath.slnx
      - run: dotnet build apps/backend/ProofPath.slnx --no-restore
      - run: dotnet test apps/backend/ProofPath.slnx --no-build

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: '22', cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env: { POSTGRES_USER: proofpath_e2e, POSTGRES_PASSWORD: isolated-e2e-only, POSTGRES_DB: proofpath_e2e }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U proofpath_e2e -d proofpath_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PROOFPATH_E2E_CONNECTION: Host=127.0.0.1;Port=5432;Database=proofpath_e2e;Username=proofpath_e2e;Password=isolated-e2e-only
      PROOFPATH_E2E_STORAGE: /tmp/proofpath-e2e-private
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with: { dotnet-version: '10.0.x' }
      - uses: actions/setup-node@v6
        with: { node-version: '22', cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
        working-directory: apps/web
      - run: npm exec playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm exec playwright test
        working-directory: apps/web

  containers-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Scan Git history for credentials
        run: |
          archive=gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSLo "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --log-opts='--all --full-history' --redact=100 --no-banner .
      - uses: actions/setup-dotnet@v6
        with: { dotnet-version: '10.0.x' }
      - uses: actions/setup-python@v7
        with: { python-version: '3.13' }
      - run: pip install cfn-lint
      - run: cfn-lint infra/foundation.yml infra/production.yml infra/frontend.yml infra/staging-rotation.yml
      - name: Verify staging rotation recovery
        run: python scripts/test-staging-rotation.py
      - name: Verify deployed antivirus health check
        run: python scripts/test-clamav-health.py
      - run: docker compose -f compose.production.yml config --quiet
        env: { POSTGRES_PASSWORD: ci-compose-validation-only }
      - uses: actions/setup-node@v6
        with: { node-version: '22', cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - name: Audit NuGet packages
        run: |
          dotnet list apps/backend/ProofPath.slnx package --vulnerable --include-transitive --format json |
            tee "$RUNNER_TEMP/nuget-audit.json"
          jq -e '[.. | objects | .vulnerabilities? // empty | .[] | select(.severity == "High" or .severity == "Critical")] | length == 0' "$RUNNER_TEMP/nuget-audit.json"
      - run: npm ci
        working-directory: apps/web
      - run: npm audit --audit-level=high
        working-directory: apps/web
      - run: docker build -f apps/backend/Dockerfile.api -t proofpath-api:${{ github.sha }} .
      - run: docker build -f apps/backend/Dockerfile.worker -t proofpath-worker:${{ github.sha }} .
      - run: docker build -f apps/web/Dockerfile -t proofpath-web:${{ github.sha }} .
      - name: Scan container images and AWS configuration
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          archive=trivy_0.76.2_Linux-64bit.tar.gz
          curl -fsSLo "$archive" "https://github.com/aquasecurity/trivy/releases/download/v0.76.2/$archive"
          echo "bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" trivy
          "$RUNNER_TEMP/trivy" config --severity HIGH,CRITICAL infra
          for component in api worker web; do
            "$RUNNER_TEMP/trivy" image --scanners vuln --severity HIGH,CRITICAL \
              --ignore-unfixed --exit-code 1 "proofpath-$component:$IMAGE_TAG"
          done

  code-scanning:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [csharp, javascript-typescript]
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
